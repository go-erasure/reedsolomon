name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CGO_ENABLED: "0"
  GOWORK: "off"

jobs:
  # Native amd64 and arm64. The region kernels live in github.com/go-simd/gf65536
  # (which tests every tier on its own CI); the differential oracle here
  # (galois_simd_test.go) proves the dispatch matches this package's log-table
  # scalar loop (galois_generic.go) bit for bit, and the gate enforces 100%
  # Go-statement coverage.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v ./...
      - name: Differential fuzz
        run: go test -run '^$' -fuzz FuzzGalMul -fuzztime 20s .
      - name: PAR2 decode fuzz
        run: go test -run '^$' -fuzz FuzzPAR2Reconstruct -fuzztime 20s .
      - name: Test with coverage
        # The library package only: internal/ holds the fixture and timing
        # commands, which are programs, not part of the API under the gate.
        run: go test -covermode=set -coverprofile=cover.out .
      - name: Enforce 100% coverage
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/{print $3}' | tr -d '%')
          echo "total coverage (${{ matrix.arch }}): ${pct}%"
          awk -v p="$pct" 'BEGIN{exit (p+0<100.0)?1:0}'

  # The riscv64, loong64, ppc64le and s390x kernels are tested in gf65536 with
  # their SIMD feature enabled; here the whole package (Encode/Reconstruct/Verify
  # on top of them) runs under QEMU user emulation as an integration check.
  emulated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: riscv64, image: "debian:trixie",                 qemu: "rv64,v=true,vlen=256" }
          - { arch: loong64, image: "ghcr.io/loong64/debian:trixie", qemu: "la464" }
          - { arch: ppc64le, image: "debian:trixie",                 qemu: "power9" }
          - { arch: s390x,   image: "debian:trixie",                 qemu: "qemu" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: docker run --privileged --rm tonistiigi/binfmt --install all
      - name: build ${{ matrix.arch }} test binary
        run: GOOS=linux GOARCH=${{ matrix.arch }} go test -c -o /tmp/t.test .
      - name: run under QEMU
        run: docker run --rm --platform linux/${{ matrix.arch }} -e QEMU_CPU=${{ matrix.qemu }} -v /tmp:/t -v ${{ github.workspace }}/testdata:/t/testdata:ro -w /t ${{ matrix.image }} /t/t.test -test.v

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/riscv64
          - linux/ppc64le
          - linux/s390x
          - linux/loong64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Build ${{ matrix.target }}
        run: |
          export GOOS=${{ matrix.target }}
          export GOARCH=${GOOS#*/}
          export GOOS=${GOOS%/*}
          go build ./...
